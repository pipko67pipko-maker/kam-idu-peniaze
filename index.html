<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peniaze">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kam idú peniaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pocket app for monthly bills. One column. The hero is the money left after bills;
   inside it income and spending as two bars on one scale; below, categories that open to show their bills.
   Single light theme by choice: airy lavender-white with one warm gold accent. */
:root{
  --bg:#F6F4FA;
  --surface:#FFFFFF;
  --raised:#F1EEF6;
  --ink:#1E1A2B;
  --muted:#6E6880;
  --line:#E7E2EF;
  --gold:#F0B940;
  --gold-text:#9C6A00;
  --gold-ink:#2B1D00;
  --bad:#D9442F;
  --good:#1F8F58;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --c-housing:#3D6FF2; --c-food:#F08A1C; --c-transport:#12A594; --c-subs:#8B5CF6;
  --c-fun:#E8559A; --c-health:#2FA36B; --c-debt:#E5533D; --c-other:#8A8499;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(120% 60% at 100% -10%,rgba(240,185,64,.18),transparent 60%),radial-gradient(90% 50% at -20% 0%,rgba(139,92,246,.10),transparent 60%);
  background-repeat:no-repeat;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding:max(18px,calc(env(safe-area-inset-top,0px) + 8px)) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{color:var(--muted);font-size:13px;text-transform:capitalize}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}

/* hero */
.hero{position:relative;padding:22px 20px 20px;border-radius:28px;background:linear-gradient(160deg,#FFF4D9 0%,#FFFFFF 62%);border:1px solid #F1E3BF;box-shadow:0 10px 30px rgba(120,90,20,.08);overflow:hidden;display:flex;flex-direction:column;gap:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(240,185,64,.30),transparent 70%);pointer-events:none}
.eyebrow{color:var(--muted);font-size:14px;font-weight:500}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,12.5vw,56px);line-height:1;letter-spacing:-.035em;color:var(--ink);overflow-wrap:anywhere}
.big.neg{color:var(--bad)}
.big .cur{font-size:.5em;letter-spacing:0;margin-left:.12em;vertical-align:.55em;opacity:.85}
.sub{color:var(--muted);font-size:14px}
.sub strong{color:var(--ink);font-weight:600}
.stack{height:14px;border-radius:99px;background:var(--raised);display:flex;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;width:0}
@media (prefers-reduced-motion:no-preference){.stack i{transition:width .9s cubic-bezier(.2,.8,.2,1)}}
.hero-row{display:flex;gap:10px}
.pill{flex:1;min-width:0;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.pill span{color:var(--muted);font-size:12.5px}
.pill b{font-weight:600;font-size:16px;overflow-wrap:anywhere}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--gold)}
.pill .edit{color:var(--gold-text);font-size:12px;font-weight:500}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(40,30,70,.04);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:-.01em;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head .num{color:var(--muted);font-size:14px}


/* donut */
.chart{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:156px;height:156px;flex:none;margin:0 auto}
.donut circle{transition:opacity .2s}
.donut text{fill:var(--ink)}
.legend{flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.legend button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;border-radius:12px;padding:6px 8px 6px 4px;text-align:left;min-height:44px}
.legend button:hover{background:var(--raised)}
.legend button[aria-pressed="true"]{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.legend .pct{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:15px;margin:0}

/* icons */
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.ic.sm{width:28px;height:28px;border-radius:9px}
.ic.sm svg{width:15px;height:15px}

/* insights */
.insights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip{min-width:0;background:var(--raised);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tip.wide{grid-column:1/-1}
.tip .k{font-size:12px;color:var(--muted);font-weight:500;line-height:1.25}
.tip .v{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.15}
.tip p{margin:2px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}
.tip.warn{background:#FDECEA}.tip.warn .v{color:var(--bad)}
.tip.good{background:#E7F6EE}.tip.good .v{color:var(--good)}

/* list */
.filter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;background:transparent;text-align:left;border-radius:14px;min-height:60px}
.item:hover{background:var(--raised)}
.list li.it+li.it .item{border-top:1px solid var(--line);border-radius:0}
.item .nm{min-width:0;font-weight:500;overflow-wrap:anywhere}
.item .meta{display:block;color:var(--muted);font-size:13px;font-weight:400}
.item .amt{font-weight:600;text-align:right}
.item .amt small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* demo banner */
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed rgba(200,140,10,.45);background:rgba(240,185,64,.10);border-radius:18px;padding:12px 14px;font-size:14px}
.demo[hidden]{display:none}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px}

/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px max(16px,calc(50% - 214px)) calc(8px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;border-radius:14px;padding:4px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--gold-text)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;border:0;background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:0 24px 0 18px;height:56px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 12px 28px rgba(156,106,0,.30),0 0 0 6px rgba(246,244,250,.85)}
.fab svg{width:22px;height:22px}
.vs{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.vs-row{display:flex;flex-direction:column;gap:7px}
.vs-top{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.vs-top b{margin-left:auto;color:var(--ink);font-weight:700;font-size:16px}
.link{border:0;background:none;padding:6px 2px;margin:-6px 0;color:var(--gold-text);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.bar{height:18px;border-radius:7px;background:var(--raised);display:flex;gap:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.bar i.inc{background:linear-gradient(90deg,#2FA36B,#45C384);border-radius:7px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .9s cubic-bezier(.2,.8,.2,1)}}
.total{background:linear-gradient(135deg,#E7F6EE,#F4FBF7);border:1px solid #CDEBDA;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.total span{font-size:13px;color:#2C6B4B;font-weight:500}
.total b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--good)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--raised)}
.tips li.urgent{background:#FDECEA}
.tips b{display:block;font-weight:600;line-height:1.3}
.tips p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.tips .gain{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--good);background:#E7F6EE;border-radius:99px;padding:3px 10px}
.tipcard{background:linear-gradient(160deg,#F3EEFF,#FFFFFF 70%);border-color:#E4DAFA}
.tiptext{margin:0;font-size:15.5px;line-height:1.5}
.acc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.acc-item{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.acc-item.open{border-color:#DCD5E8;box-shadow:0 4px 14px rgba(40,30,70,.06)}
.acc-head{width:100%;display:grid;grid-template-columns:36px 1fr 28px;gap:12px;align-items:center;border:0;background:transparent;text-align:left;padding:12px;min-height:72px}
.acc-mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.acc-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.acc-top b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.acc-top .num{font-weight:700}
.acc-meter{height:6px;border-radius:9px;background:var(--raised);overflow:hidden}
.acc-meter i{display:block;height:100%;border-radius:9px}
.acc-sub{font-size:12.5px;color:var(--muted)}
.chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--muted)}
.chev svg{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}}
.acc-item.open .chev{transform:rotate(180deg);color:var(--ink)}
.acc-panel{padding:0 12px 10px;border-top:1px solid var(--line);background:#FBFAFD}
.acc-panel .item{grid-template-columns:1fr auto;padding:10px 4px;min-height:56px}
.addhere{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);background:transparent;border-radius:12px;width:100%;min-height:44px;padding:0 12px;margin-top:6px;color:var(--gold-text);font-size:14px;font-weight:600}
.addhere svg{width:18px;height:18px}
.view{display:flex;flex-direction:column;gap:14px}
.sortbar{display:flex;gap:6px;background:var(--raised);border-radius:12px;padding:4px}
.sortbar button{flex:1;border:0;background:transparent;border-radius:9px;min-height:38px;font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.sortbar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(30,26,43,.12)}
.group{display:flex;align-items:center;gap:10px;padding:14px 4px 4px;font-weight:600;font-size:14px}
.group:first-child{padding-top:2px}
.group span:nth-child(2){flex:1;min-width:0}
.group .num{color:var(--muted);font-weight:500}
.upcoming{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.license{text-align:center;color:var(--muted);font-size:12px;margin:-6px 0 0;opacity:.8}
.saved{text-align:center;color:var(--muted);font-size:13px;min-height:1.3em;margin:0}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(30,26,43,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);box-shadow:0 -10px 40px rgba(30,26,43,.15);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet,.veil{transition:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.sheet form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
[hidden]{display:none!important}
.field>span,.field>label{font-size:13px;color:var(--muted);font-weight:500}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:17px;min-height:52px}
.input:focus{border-color:var(--gold);outline:none}
.money{position:relative}
.money .input{font-family:var(--display);font-weight:700;font-size:26px;padding-right:56px;letter-spacing:-.02em}
.money i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);min-height:72px;min-width:0}
.cat span:last-child{max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.2}
.cat[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:#FFF4D9}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;font-size:14px;font-weight:500;padding:0}
.days button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.freqs{display:flex;flex-wrap:wrap;gap:8px}
.freqs button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:0 14px;min-height:42px;font-size:14px;font-weight:500}
.freqs button[aria-pressed="true"]{border-color:var(--gold);background:#FFF4D9;color:var(--gold-text);font-weight:700}
.err{color:var(--bad);font-size:14px;margin:0;min-height:1.2em}
.actions{display:flex;gap:10px}
.sheet .actions{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 calc(22px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.primary{flex:1;border:0;background:var(--gold);color:var(--gold-ink);border-radius:16px;min-height:54px;font-weight:700;font-size:16px}
.danger{border:1px solid rgba(217,68,47,.35);background:transparent;color:var(--bad);border-radius:16px;min-height:54px;padding:0 18px;font-weight:600}
.danger.armed{background:var(--bad);color:#FFFFFF;border-color:var(--bad)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:#FFF4D9;color:var(--gold-text)}
.note{color:var(--muted);font-size:13.5px;margin:0}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><small id="today"></small><b data-t="title"></b></div>
    <button class="round" id="openSettings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="demo" id="demo" hidden>
    <span data-t="demoText"></span>
    <button class="ghost" id="clearDemo" type="button" data-t="demoBtn"></button>
  </div>

  <section class="hero" aria-live="polite">
    <div class="eyebrow" data-t="left"></div>
    <div class="big num" id="leftVal"></div>
    <div class="sub" id="leftSub"></div>

    <div class="vs" id="vs">
      <div class="vs-row">
        <div class="vs-top"><span data-t="income"></span><button type="button" class="link" id="incomeBtn" data-t="change"></button><b class="num" id="incomeVal"></b></div>
        <div class="bar"><i class="inc" id="incBar"></i></div>
      </div>
      <div class="vs-row">
        <div class="vs-top"><span data-t="bills"></span><b class="num" id="billsVal"></b></div>
        <div class="bar" id="expBar"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2 data-t="byCat"></h2><span class="num" id="billsCount"></span></div>
    <ul class="acc" id="acc"></ul>
  </section>

  <section class="card" id="saveCard">
    <div class="head"><h2 data-t="saveTitle"></h2></div>
    <div class="total" id="saveTotal"></div>
    <ul class="tips" id="saveList"></ul>
  </section>

  <section class="card tipcard">
    <div class="head"><h2 data-t="tipTitle"></h2><button type="button" class="link" id="nextTip" data-t="nextTip"></button></div>
    <p class="tiptext" id="tipText"></p>
  </section>

  <p class="saved" id="saved" role="status"></p>
  <p class="license" data-t="license"></p>
</main>

<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span data-t="addBill"></span>
</button>

<div class="veil" id="veil"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h3 id="sheetTitle"></h3>
  <form id="form" novalidate>
    <div class="field money">
      <label for="fAmount" data-t="amount"></label>
      <div class="money"><input class="input num" id="fAmount" inputmode="decimal" autocomplete="off" placeholder="0"><i id="curSym"></i></div>
    </div>
    <div class="field">
      <label for="fName" data-t="name"></label>
      <input class="input" id="fName" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <span data-t="cat"></span>
      <div class="cats" id="cats" role="group"></div>
    </div>
    <div class="field">
      <span data-t="freqQ"></span>
      <div class="freqs" id="freqs" role="group"></div>
    </div>
    <div class="field" id="dayField">
      <span data-t="dayQ"></span>
      <div class="days" id="days" role="group"></div>
    </div>

  $("curSym").textContent=$("curSym2").textContent=sym();
  $("wipe").textContent=t("wipe");$("fab").setAttribute("aria-label",t("addBill"));
}
var shown=null;
function countTo(node,to,isNeg){
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var from=shown==null?0:shown;shown=to;
  function paint(v){
    node.textContent="";
    node.appendChild(document.createTextNode(plain(v,0)));
    node.appendChild(el("span","cur",sym()));
  }
  if(reduce||from===to){paint(to);return}
  var start=null,dur=firstPaint?1100:450;
  function step(ts){if(!start)start=ts;var p=Math.min((ts-start)/dur,1),e=1-Math.pow(1-p,3);paint(from+(to-from)*e);if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
function renderHero(fT,byCat,parts){
  var left=state.income-fT;
  var big=$("leftVal");big.classList.toggle("neg",left<0);countTo(big,Math.round(left),left<0);
  var sub=$("leftSub");
  if(state.income>0)sub.innerHTML=L().spendShare(Math.round(fT/state.income*100));else sub.textContent=t("noIncome");
  $("incomeVal").textContent=money(state.income,0);
  $("billsVal").textContent=money(fT,0);
}
var openCats={};
function whenText(x){
  return x.freq==="m"?L().dayOf(x.day):L().every[x.freq]+" · "+L().nextOn(new Date(nextOcc(x)*864e5).toLocaleDateString(locale(),{day:"numeric",month:"numeric",timeZone:"UTC"}));
}
function renderVs(fT,byCat,parts){
  var base=Math.max(state.income,fT,1);
  var inc=$("incBar");inc.dataset.w=(state.income/base*100)+"%";
  var bar=$("expBar");bar.textContent="";
  parts.forEach(function(c){var i=el("i");i.style.background=col(c);i.title=L().cats[c];i.dataset.w=(byCat[c]/base*100)+"%";bar.appendChild(i)});
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    inc.style.width=inc.dataset.w;
    Array.prototype.forEach.call(bar.children,function(i){i.style.width=i.dataset.w});
  })});
}
function renderAcc(fT,byCat,parts){
  var ul=$("acc");ul.textContent="";
  $("billsCount").textContent=L().billsN(state.fixed.length);
  if(!parts.length){var e=el("li");e.appendChild(el("p","empty",t("emptyList")));ul.appendChild(e);return}
  parts.forEach(function(c){
    var items=state.fixed.filter(function(x){return x.cat===c}).sort(function(a,b){return monthly(b)-monthly(a)});
    var open=!!openCats[c];
    var li=el("li","acc-item"+(open?" open":""));
    var head=el("button","acc-head");head.type="button";head.setAttribute("aria-expanded",String(open));head.id="h-"+c;head.setAttribute("aria-controls","p-"+c);
    head.appendChild(icon(c));
    var mid=el("span","acc-mid");
    var top=el("span","acc-top");top.appendChild(el("b",null,L().cats[c]));top.appendChild(el("span","num",money(byCat[c],0)));
    mid.appendChild(top);
    var meter=el("span","acc-meter");var fill=el("i");fill.style.background=col(c);
    var share=state.income>0?byCat[c]/state.income*100:byCat[c]/Math.max(fT,1)*100;
    fill.style.width=Math.min(share,100)+"%";meter.appendChild(fill);mid.appendChild(meter);
    mid.appendChild(el("span","acc-sub",(state.income>0?L().ofIncome(Math.round(share)):Math.round(share)+" %")+" · "+L().billsN(items.length)));
    head.appendChild(mid);
    var chev=el("span","chev");chev.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    head.appendChild(chev);
    head.addEventListener("click",function(){openCats[c]=!openCats[c];render()});
    li.appendChild(head);
    var panel=el("div","acc-panel");panel.id="p-"+c;panel.setAttribute("role","region");panel.setAttribute("aria-labelledby","h-"+c);panel.hidden=!open;
    var inner=el("ul","list");
    items.forEach(function(x){
      var r=el("li","it"),b=el("button","item");b.type="button";
      var nm=el("span","nm",x.name);nm.appendChild(el("span","meta",whenText(x)));b.appendChild(nm);
      var a=el("span","amt num",money(x.amount));
      a.appendChild(el("small",null,x.freq==="m"?money(x.amount*12,0)+" "+t("yearly"):L().avgMonth(money(monthly(x),0))));b.appendChild(a);
      b.addEventListener("click",function(){openSheet(x)});
      r.appendChild(b);inner.appendChild(r);
    });
    panel.appendChild(inner);
    var add=el("button","addhere");add.type="button";
    add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    add.appendChild(el("span",null,L().addTo(L().cats[c])));
    add.addEventListener("click",function(){openSheet(null,c)});
    panel.appendChild(add);
    li.appendChild(panel);ul.appendChild(li);
  });
}
var PHONE=/internet|mobil|telef|phone|o2|orange|telekom|4ka|vodafone|tarif/,ENERGY=/energi|energy|elektrin|elektrik|electric|plyn|\bgas\b|teplo|heating/;
function norm(x){return String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
var tipIdx=Math.floor(Date.now()/864e5);
function renderSave(fT,byCat,parts){
  var list=$("saveList");list.textContent="";var tot=$("saveTotal");tot.textContent="";
  var out=[],left=state.income-fT,I=state.income;
  if(!state.fixed.length){tot.hidden=true;var li=el("li");li.style.display="block";li.appendChild(el("p",null,t("sNone")));list.appendChild(li);return}
  function add(c,arr,gain,urgent,prio){out.push({c:c,t:arr[0],p:arr[1],gain:gain,urgent:urgent,prio:prio||0})}
  if(I>0&&left<0)add("other",L().sOver(money(-left,0)),null,true,100);
  var subs=state.fixed.filter(function(x){return x.cat==="subs"});
  if(subs.length){
    var sT=sum(subs),cand=subs.filter(function(x){return !PHONE.test(norm(x.name))}).sort(function(a,b){return monthly(b)-monthly(a)});
    if(cand.length){var top=cand[0];add("subs",L().sSubs(subs.length,money(sT,0),money(sT*12,0),top.name,money(monthly(top)*12,0)),monthly(top)*12,false,5)}
  }
  var hp=I>0?byCat.housing/I*100:0;
  if(hp>32)add("housing",L().sHousing(Math.round(hp)),null,false,4);
  var billTips=0;
  state.fixed.slice().sort(function(a,b){return monthly(b)-monthly(a)}).forEach(function(x){
    var n=norm(x.name),before=out.length;
    if(billTips<2){
      if(ENERGY.test(n)&&!/enka|listok|mhd|ticket|tram/.test(n))add(x.cat,L().sEnergy(x.name),null,false,3);
      else if(PHONE.test(n)&&monthly(x)>=15)add(x.cat,L().sPhone(x.name,money(monthly(x),0)),null,false,3);
      else if(/poist|insur|pzp|havar/.test(n))add(x.cat,L().sInsur(x.name),null,false,3);
      if(out.length>before)billTips++;
    }
    if(x.freq==="y"&&x.amount>=100)add(x.cat,L().sYearly(x.name,money(x.amount/12,0)),null,false,1);
  });
  var dp=I>0?byCat.debt/I*100:0;
  if(dp>=15)add("debt",L().sDebt(Math.round(dp)),null,false,3);
  var flex=["food","fun","transport","other"].filter(function(c){return byCat[c]>0}).sort(function(a,b){return byCat[b]-byCat[a]});
  flex.forEach(function(c,i){
    var p=I>0?byCat[c]/I*100:0;
    if(p>=5||(!I&&byCat[c]>=50))add(c,L().sCut(L().cats[c],Math.round(p),money(byCat[c]*0.1,0)),byCat[c]*0.1*12,false,i===0?4.5:2);
  });
  if(I>0&&left>0&&left/I<0.1)add("other",L().sLow(Math.round(left/I*100)),null,true,6);
  else if(I>0&&left>0)add("health",L().sSave(money(left*0.2,0),money(left*0.2*12,0)),null,false,0);
  /* one card per bill name/kind; most useful first */
  var seen={};out=out.filter(function(o){if(seen[o.t])return false;seen[o.t]=1;return true});
  out.sort(function(a,b){return (b.prio-a.prio)||((b.gain||0)-(a.gain||0))});
  out=out.slice(0,5);
  var g=out.reduce(function(s,o){return s+(o.gain||0)},0);
  tot.hidden=!(g>0);
  if(g>0){tot.appendChild(el("span",null,t("saveTotalL")));tot.appendChild(el("b","num",money(g,0)+" "+t("perYear")))}
  out.forEach(function(o){
    var li=el("li",o.urgent?"urgent":null);li.appendChild(icon(o.c));
    var d=el("div");d.appendChild(el("b",null,o.t));d.appendChild(el("p",null,o.p));
    if(o.gain)d.appendChild(el("span","gain num",L().gain(money(o.gain,0))));
    li.appendChild(d);list.appendChild(li);
  });
}
function renderTip(){var a=L().tips;$("tipText").textContent=a[((tipIdx%a.length)+a.length)%a.length]}
function render(){
  renderText();
  $("demo").hidden=!state.demo;
  var fT=sum(state.fixed);
  var byCat={};CATS.forEach(function(c){byCat[c]=0});state.fixed.forEach(function(x){byCat[x.cat]+=monthly(x)});
  var parts=CATS.filter(function(c){return byCat[c]>0}).sort(function(a,b){return byCat[b]-byCat[a]});
  renderHero(fT,byCat,parts);renderVs(fT,byCat,parts);renderAcc(fT,byCat,parts);renderSave(fT,byCat,parts);renderTip();
  firstPaint=false;
}

/* ---------- sheets ---------- */
var openEl=null,lastFocus=null,pick={cat:"housing",day:1,freq:"m"};
function show(sheet){
  lastFocus=document.activeElement;openEl=sheet;
  $("veil").classList.add("open");sheet.classList.add("open");
  setTimeout(function(){var f=sheet.querySelector("input");if(f&&sheet.id==="settings")return;if(f)f.focus({preventScroll:true})},260);
}
function hide(){
  if(!openEl)return;
  openEl.classList.remove("open");$("veil").classList.remove("open");openEl=null;
  disarm();if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}
function buildPickers(){
  var cats=$("cats");cats.textContent="";
  CATS.forEach(function(c){
    var b=el("button","cat");b.type="button";b.setAttribute("aria-pressed",String(pick.cat===c));
    b.appendChild(icon(c,true));b.appendChild(el("span",null,L().cats[c]));
    b.addEventListener("click",function(){pick.cat=c;buildPickers()});cats.appendChild(b);
  });
  var fr=$("freqs");fr.textContent="";
  ["m","w4","w2","w1","y"].forEach(function(f){
    var b=el("button",null,L().freqs[f]);b.type="button";b.setAttribute("aria-pressed",String(pick.freq===f));
    b.addEventListener("click",function(){pick.freq=f;buildPickers()});fr.appendChild(b);
  });
  $("dayField").hidden=pick.freq!=="m";$("dateField").hidden=pick.freq==="m";
  $("dateHint").textContent=t("startHint");
  var days=$("days");days.textContent="";
  for(var d=1;d<=31;d++)(function(d){
    var b=el("button","num",String(d));b.type="button";b.setAttribute("aria-pressed",String(pick.day===d));
    b.addEventListener("click",function(){pick.day=d;buildPickers()});days.appendChild(b);
  })(d);
}
function openSheet(item,presetCat){
  editing=item||null;
  pick={cat:item?item.cat:(presetCat||"housing"),day:item?item.day:TODAY,freq:item?item.freq:"m"};
  $("fStart").value=iso(item&&item.freq!=="m"?(nextOcc(item)||item.start):TODAYN);
  $("sheetTitle").textContent=t(item?"editBill":"newBill");
  $("fName").value=item?item.name:"";$("fName").placeholder=t("namePh");
  $("fAmount").value=item?String(item.amount).replace(".",state.lang==="sk"?",":"."):"";
  $("save").textContent=t(item?"saveB":"add");
  $("del").hidden=!item;$("del").textContent=t("del");$("err").textContent="";
  buildPickers();show($("sheet"));
}
var armed=null;
function disarm(){armed=null;$("del").classList.remove("armed");$("del").textContent=t("del");$("wipe").classList.remove("armed");$("wipe").textContent=t("wipe")}

$("fab").addEventListener("click",function(){openSheet(null)});
$("nextTip").addEventListener("click",function(){tipIdx++;renderTip()});
$("fab").setAttribute("aria-label",T.sk.addBill);

$("veil").addEventListener("click",hide);
document.addEventListener("keydown",function(e){if(e.key==="Escape")hide()});
$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var amount=parseNum($("fAmount").value),name=$("fName").value.trim();
  if(!(amount>0)){$("err").textContent=t("eAmount");$("fAmount").focus();return}
  if(!name){$("err").textContent=t("eName");$("fName").focus();return}
  var st=fromIso($("fStart").value);if(st==null)st=TODAYN;
  var data={name:name.slice(0,40),amount:Math.round(amount*100)/100,cat:pick.cat,day:pick.freq==="m"?pick.day:new Date(st*864e5).getUTCDate(),freq:pick.freq,start:st};
  if(editing){var x=state.fixed.filter(function(y){return y.id===editing.id})[0];if(x){x.name=data.name;x.amount=data.amount;x.cat=data.cat;x.day=data.day;x.freq=data.freq;x.start=data.start}}
  else{data.id=uid();state.fixed.push(data)}
  state.demo=false;persist();hide();render();
});
$("del").addEventListener("click",function(){
  if(armed!=="del"){armed="del";this.classList.add("armed");this.textContent=t("delSure");return}
  var id=editing&&editing.id;state.fixed=state.fixed.filter(function(y){return y.id!==id});persist();hide();render();
});
$("clearDemo").addEventListener("click",function(){
  state={lang:state.lang,cur:state.cur,income:0,demo:false,fixed:[]};filter=null;shown=null;persist();render();openSettings();
});
function buildSettings(){
  var ls=$("langSeg");ls.textContent="";
  [["sk","Slovenčina"],["en","English"]].forEach(function(o){var b=el("button",null,o[1]);b.type="button";b.setAttribute("aria-pressed",String(state.lang===o[0]));
    b.addEventListener("click",function(){state.lang=o[0];persist();render();buildSettings()});ls.appendChild(b)});
  var cs=$("curSeg");cs.textContent="";
  CURS.forEach(function(o){var b=el("button",null,o[1]);b.type="button";b.setAttribute("aria-pressed",String(state.cur===o[0]));
    b.addEventListener("click",function(){state.cur=o[0];persist();render();buildSettings()});cs.appendChild(b)});
  if(document.activeElement!==$("incomeInput"))$("incomeInput").value=state.income?String(state.income).replace(".",state.lang==="sk"?",":"."):"";
}
function openSettings(){buildSettings();show($("settings"))}
$("openSettings").addEventListener("click",openSettings);
$("incomeBtn").addEventListener("click",function(){openSettings();setTimeout(function(){$("incomeInput").focus({preventScroll:true});$("incomeInput").select()},280)});
$("closeSettings").addEventListener("click",hide);
$("incomeInput").addEventListener("input",function(e){var n=parseNum(e.target.value);state.income=isNaN(n)?0:Math.round(Math.abs(n)*100)/100;state.demo=false;persist();render()});
$("incomeInput").addEventListener("keydown",function(e){if(e.key==="Enter")hide()});
$("wipe").addEventListener("click",function(){
  if(armed!=="wipe"){armed="wipe";this.classList.add("armed");this.textContent=t("wipeSure");return}
  state={lang:state.lang,cur:state.cur,income:0,demo:false,fixed:[]};filter=null;shown=null;persist();hide();render();
});

render();
